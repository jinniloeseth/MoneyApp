<ion-header>
  <ion-toolbar>
    <ion-title>Oversikt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="month-picker">
    <ion-button fill="clear" (click)="previousMonth()">
      <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <span class="month-label">{{ monthLabel }}</span>
    <ion-button fill="clear" (click)="nextMonth()">
      <ion-icon name="chevron-forward-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

  <div class="total">
    <span class="total-label">Totalt brukt</span>
    <span class="total-amount">{{ total }} kr</span>
  </div>

  @for (s of categorySums; track s.category.id) {
    <div class="category-row">
      <div class="category-top">
        <span class="category-name">
          <span class="dot" [style.background]="s.category.color"></span>
          {{ s.category.name }}
        </span>
        <span class="category-amount">{{ s.total }} kr</span>
      </div>
      <div class="bar">
        <div class="bar-fill" [style.width.%]="s.percent" [style.background]="s.category.color"></div>
      </div>
    </div>
  } @empty {
    <p class="empty">Ingen utgifter denne måneden.</p>
  }
</ion-content>
