<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Rediger kategorier</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openNew()">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (c of categories; track c.id) {
      <ion-item button detail="false" (click)="openEdit(c)">
        <ion-icon [name]="c.icon" slot="start" [style.color]="c.color"></ion-icon>
        <ion-label>{{ c.name }}</ion-label>
        <ion-button fill="clear" color="danger" slot="end" (click)="deleteCategory(c.id, $event)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
    }
  </ion-list>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="closeModal()">Avbryt</ion-button>
          </ion-buttons>
          <ion-title>{{ editingId === null ? 'Ny kategori' : 'Rediger kategori' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button strong (click)="save()" [disabled]="!name.trim()">Lagre</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-input
          label="Navn"
          labelPlacement="floating"
          fill="outline"
          placeholder="F.eks. Klær"
          [(ngModel)]="name"
        ></ion-input>

        <p class="picker-label">Farge</p>
        <div class="colors">
          @for (color of colors; track color) {
            <button
              class="color"
              [class.selected]="selectedColor === color"
              [style.background]="color"
              (click)="selectedColor = color"
            ></button>
          }
        </div>

        <p class="picker-label">Ikon</p>
        <div class="icons">
          @for (icon of icons; track icon) {
            <button
              class="icon"
              [class.selected]="selectedIcon === icon"
              [style.color]="selectedColor"
              (click)="selectedIcon = icon"
            >
              <ion-icon [name]="icon"></ion-icon>
            </button>
          }
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
