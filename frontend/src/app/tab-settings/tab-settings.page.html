<ion-header>
  <ion-toolbar>
    <ion-title>Innstillinger</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile">
    <ion-avatar class="avatar">
      @if (profileImageUrl) {
        <img [src]="profileImageUrl" alt="Profilbilde" />
      } @else {
        <div class="avatar-placeholder">
          <ion-icon name="person-outline"></ion-icon>
        </div>
      }
    </ion-avatar>
    <h2>{{ userName }}</h2>
    <p>{{ userEmail }}</p>
  </div>

  <ion-list [inset]="true">
    <ion-item button detail routerLink="/tabs/settings/categories">
      <ion-icon name="pricetags-outline" slot="start"></ion-icon>
      <ion-label>Rediger kategorier</ion-label>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true">
    <ion-item button [detail]="false">
      <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
      <ion-label color="danger">Logg ut</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
